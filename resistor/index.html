<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องคำนวณค่าความต้านทาน (Resistor Calculator)</title>
    <!-- โหลด Libraries ที่จำเป็น -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- ใช้ Tailwind ผ่าน CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            background: #f1f5f9;
        }
    </style>
</head>
<body>

    <!-- เริ่มต้นส่วนเครื่องคำนวณ -->
    <div id="resistor-app-container" style="width: 100%; margin: 0 auto; font-family: sans-serif;">
        <!-- จุดแสดงผล App -->
        <div id="root-resistor" class="text-center p-8 text-gray-500">กำลังโหลด...</div>
    </div>

    <script type="text/babel">
        // --- เริ่มต้นโค้ด React ---
        const { useState, useMemo, useEffect, useRef } = React;

        const COLORS = [
            { name: "ดำ", value: 0, color: "#000000", text: "white" },
            { name: "น้ำตาล", value: 1, color: "#8B4513", text: "white" },
            { name: "แดง", value: 2, color: "#FF0000", text: "white" },
            { name: "ส้ม", value: 3, color: "#FF8C00", text: "black" },
            { name: "เหลือง", value: 4, color: "#FFD700", text: "black" },
            { name: "เขียว", value: 5, color: "#008000", text: "white" },
            { name: "น้ำเงิน", value: 6, color: "#0000FF", text: "white" },
            { name: "ม่วง", value: 7, color: "#800080", text: "white" },
            { name: "เทา", value: 8, color: "#808080", text: "white" },
            { name: "ขาว", value: 9, color: "#FFFFFF", text: "black" },
        ];

        const MULTIPLIERS = [
            { name: "ดำ (x1)", value: 1, color: "#000000" },
            { name: "น้ำตาล (x10)", value: 10, color: "#8B4513" },
            { name: "แดง (x100)", value: 100, color: "#FF0000" },
            { name: "ส้ม (x1k)", value: 1000, color: "#FF8C00" },
            { name: "เหลือง (x10k)", value: 10000, color: "#FFD700" },
            { name: "เขียว (x100k)", value: 100000, color: "#008000" },
            { name: "น้ำเงิน (x1M)", value: 1000000, color: "#0000FF" },
            { name: "ม่วง (x10M)", value: 10000000, color: "#800080" },
            { name: "ทอง (x0.1)", value: 0.1, color: "#FFD700" },
            { name: "เงิน (x0.01)", value: 0.01, color: "#C0C0C0" },
        ];

        const TOLERANCES = [
            { name: "น้ำตาล (±1%)", value: 1, color: "#8B4513" },
            { name: "แดง (±2%)", value: 2, color: "#FF0000" },
            { name: "เขียว (±0.5%)", value: 0.5, color: "#008000" },
            { name: "น้ำเงิน (±0.25%)", value: 0.25, color: "#0000FF" },
            { name: "ม่วง (±0.1%)", value: 0.1, color: "#800080" },
            { name: "ทอง (±5%)", value: 5, color: "#FFD700" },
            { name: "เงิน (±10%)", value: 10, color: "#C0C0C0" },
        ];

        const ResistorBand = ({ color, width = "w-4", height = "h-full", className="" }) => (
            <div className={`absolute top-0 ${width} ${height} ${className} shadow-sm`} style={{ backgroundColor: color }}></div>
        );

        // Select Component แบบง่าย
        const SimpleSelect = ({ label, options, value, onChange, color }) => (
            <div className="mb-2">
                <label className="block text-xs font-bold text-gray-500 mb-1">{label}</label>
                <div className="flex items-center border rounded bg-white p-1">
                    <div className="w-4 h-4 rounded-full mr-2 border border-gray-300 flex-shrink-0" style={{ backgroundColor: color }}></div>
                    <select 
                        value={value} 
                        onChange={(e) => onChange(Number(e.target.value))}
                        className="w-full bg-transparent border-none text-sm focus:outline-none text-gray-700"
                    >
                        {options.map((opt, idx) => <option key={idx} value={idx}>{opt.name}</option>)}
                    </select>
                </div>
            </div>
        );

        const App = () => {
            const [bands, setBands] = useState(4);
            const [band1, setBand1] = useState(1);
            const [band2, setBand2] = useState(0);
            const [band3, setBand3] = useState(0);
            const [multiplier, setMultiplier] = useState(2);
            const [tolerance, setTolerance] = useState(5);
            
            // State สำหรับค่าที่กรอกเอง
            const [manualValue, setManualValue] = useState("");
            const isManualChange = useRef(false);

            const result = useMemo(() => {
                let ohms = 0;
                if (bands === 4) {
                    ohms = (COLORS[band1].value * 10 + COLORS[band2].value) * MULTIPLIERS[multiplier].value;
                } else {
                    ohms = (COLORS[band1].value * 100 + COLORS[band2].value * 10 + COLORS[band3].value) * MULTIPLIERS[multiplier].value;
                }
                return ohms;
            }, [bands, band1, band2, band3, multiplier]);

            // อัปเดตช่องกรอก เมื่อค่าจากการคำนวณเปลี่ยน (ถ้าไม่ได้กำลังพิมพ์เอง)
            useEffect(() => {
                if (!isManualChange.current) {
                    setManualValue(result);
                } else {
                    isManualChange.current = false;
                }
            }, [result]);

            const handleManualInput = (e) => {
                const valStr = e.target.value;
                setManualValue(valStr);
                
                const val = parseFloat(valStr);
                if (isNaN(val) || val <= 0) return;

                isManualChange.current = true;

                // Logic คำนวณย้อนกลับจาก ค่า -> สี
                // หา Magnitude (10^x)
                let magnitude = Math.floor(Math.log10(val));
                let normalized = val / Math.pow(10, magnitude);
                
                let digitsVal, multiplierShift;

                if (bands === 4) {
                    // ต้องการ 2 หลัก (เช่น 47)
                    digitsVal = Math.round(normalized * 10);
                    multiplierShift = magnitude - 1;
                } else {
                    // ต้องการ 3 หลัก (เช่น 470)
                    digitsVal = Math.round(normalized * 100);
                    multiplierShift = magnitude - 2;
                }

                // ปรับกรณีปัดเศษแล้วเกินหลัก (เช่น 9.95 -> 10.0)
                if (bands === 4 && digitsVal >= 100) {
                    digitsVal = Math.round(digitsVal / 10);
                    multiplierShift += 1;
                }
                if (bands === 5 && digitsVal >= 1000) {
                    digitsVal = Math.round(digitsVal / 10);
                    multiplierShift += 1;
                }

                const digitStr = digitsVal.toString();
                
                // แยกหลักตัวเลข
                const b1 = parseInt(digitStr[0]) || 0;
                const b2 = parseInt(digitStr[1]) || 0;
                const b3 = bands === 5 ? (parseInt(digitStr[2]) || 0) : 0;

                // หาตัวคูณที่ใกล้เคียงที่สุด
                let mIndex = -1;
                let minDiff = Number.MAX_VALUE;
                
                MULTIPLIERS.forEach((m, idx) => {
                    // เปรียบเทียบ log10 เพื่อความแม่นยำของเลขยกกำลัง
                    const diff = Math.abs(Math.log10(m.value) - multiplierShift);
                    if (diff < minDiff) {
                        minDiff = diff;
                        mIndex = idx;
                    }
                });

                // อัปเดต State (ถ้าสีเปลี่ยน result จะเปลี่ยน และ useEffect จะทำงานแต่ติด flag ไว้)
                if (mIndex !== -1) {
                    setBand1(b1);
                    setBand2(b2);
                    if (bands === 5) setBand3(b3);
                    setMultiplier(mIndex);
                }
            };

            const formatResistance = (val) => {
                if (val >= 1000000) return (val / 1000000).toFixed(val % 1000000 === 0 ? 0 : 2) + " MΩ";
                if (val >= 1000) return (val / 1000).toFixed(val % 1000 === 0 ? 0 : 2) + " kΩ";
                return val.toFixed(val % 1 === 0 ? 0 : 2) + " Ω";
            };

            return (
                <div className="bg-slate-100 p-6 rounded-xl max-w-xl mx-auto border border-slate-200 shadow-md">
                    <h2 className="text-2xl font-bold text-center text-blue-900 mb-4">อ่านค่าตัวต้านทาน</h2>
                    
                    {/* รูปตัวต้านทาน */}
                    <div className="bg-white p-6 rounded-lg mb-4 flex justify-center relative border border-slate-200 overflow-hidden">
                         <div className="absolute h-1 w-full bg-gray-400 top-1/2 transform -translate-y-1/2 z-0"></div>
                         <div 
                            className="relative w-64 h-16 rounded-full z-10 border-2 flex justify-between px-8 overflow-hidden items-center transition-colors duration-500"
                            style={{ 
                                backgroundColor: bands === 5 ? "#81C7D4" : "#e6cc9d",
                                borderColor: bands === 5 ? "#5A96A1" : "#d1b37e"
                            }}
                         >
                            <ResistorBand color={COLORS[band1].color} className="left-[15%]" />
                            <ResistorBand color={COLORS[band2].color} className="left-[30%]" />
                            {bands === 5 && <ResistorBand color={COLORS[band3].color} className="left-[45%]" />}
                            <ResistorBand color={MULTIPLIERS[multiplier].color} className={bands === 4 ? "left-[50%]" : "left-[60%]"} />
                            <ResistorBand color={TOLERANCES[tolerance].color} className="right-[15%]" />
                         </div>
                    </div>

                    {/* ผลลัพธ์ & ช่องกรอก */}
                    <div className="bg-blue-600 text-white p-4 rounded-lg text-center mb-4">
                        <div className="text-xs uppercase opacity-75 mb-1">ค่าความต้านทาน (Ω)</div>
                        <div className="flex items-center justify-center gap-2">
                            <input 
                                type="number" 
                                value={manualValue}
                                onChange={handleManualInput}
                                className="text-3xl font-bold text-center rounded px-2 py-1 w-48 focus:outline-none focus:ring-2 focus:ring-yellow-400 text-slate-800"
                                placeholder="กรอกค่า..."
                            />
                            <span className="text-xl font-light">Ω</span>
                        </div>
                        <div className="text-sm mt-2 opacity-90">
                            {formatResistance(result)} ± {TOLERANCES[tolerance].value}%
                        </div>
                    </div>

                    {/* ปุ่มเลือกจำนวนแถบ */}
                    <div className="flex justify-center gap-2 mb-4">
                        <button onClick={() => setBands(4)} className={`px-4 py-1.5 rounded-lg text-sm font-semibold transition-colors ${bands===4 ? "bg-blue-600 text-white shadow-sm" : "bg-gray-200 text-gray-700 hover:bg-gray-300"}`}>4 แถบ</button>
                        <button onClick={() => setBands(5)} className={`px-4 py-1.5 rounded-lg text-sm font-semibold transition-colors ${bands===5 ? "bg-blue-600 text-white shadow-sm" : "bg-gray-200 text-gray-700 hover:bg-gray-300"}`}>5 แถบ</button>
                    </div>

                    {/* ตัวเลือกสี */}
                    <div className="grid grid-cols-2 gap-3">
                        <SimpleSelect label="แถบที่ 1" options={COLORS} value={band1} onChange={setBand1} color={COLORS[band1].color} />
                        <SimpleSelect label="แถบที่ 2" options={COLORS} value={band2} onChange={setBand2} color={COLORS[band2].color} />
                        {bands === 5 && <SimpleSelect label="แถบที่ 3" options={COLORS} value={band3} onChange={setBand3} color={COLORS[band3].color} />}
                        <SimpleSelect label="ตัวคูณ" options={MULTIPLIERS} value={multiplier} onChange={setMultiplier} color={MULTIPLIERS[multiplier].color} />
                        <div className="col-span-2">
                            <SimpleSelect label="ค่าความคลาดเคลื่อน" options={TOLERANCES} value={tolerance} onChange={setTolerance} color={TOLERANCES[tolerance].color} />
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById("root-resistor"));
        root.render(<App />);
    </script>
</body>
</html>
