<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องคำนวณอิเล็กโทรไลต์ (Through-Hole)</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Sarabun', sans-serif;
        }

        /* Capacitor Stripe Pattern */
        .stripe-pattern {
            background-image: repeating-linear-gradient(180deg,
                    transparent,
                    transparent 10px,
                    rgba(255, 255, 255, 0.2) 10px,
                    rgba(255, 255, 255, 0.2) 12px);
        }
    </style>
    <link rel="stylesheet" href="../../markdown.css">
</head>

<body class="bg-slate-50">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const App = () => {
            // Inputs
            const [capacitance, setCapacitance] = useState(470); // uF
            const [voltage, setVoltage] = useState(25); // V
            const [frequency, setFrequency] = useState(50); // Hz

            // Calculations
            const stats = useMemo(() => {
                const cFarad = capacitance / 1000000; // Convert uF to F

                // 1. Energy (Joules) = 0.5 * C * V^2
                const energy = 0.5 * cFarad * Math.pow(voltage, 2);

                // 2. Charge (Coulombs) = C * V
                const charge = cFarad * voltage;

                // 3. Reactance (Ohms) = 1 / (2 * pi * f * C)
                // Avoid division by zero
                const xc = frequency > 0 ? 1 / (2 * Math.PI * frequency * cFarad) : Infinity;

                return {
                    energy: energy < 0.001 ? (energy * 1000).toFixed(3) + " mJ" : energy.toFixed(4) + " J",
                    charge: charge < 0.001 ? (charge * 1000).toFixed(3) + " mC" : charge.toFixed(4) + " C",
                    xc: xc === Infinity ? "∞" : xc.toFixed(2) + " Ω"
                };
            }, [capacitance, voltage, frequency]);

            // Visual Scaling Logic
            const visualSize = useMemo(() => {
                // Scale factor logic
                const capScale = Math.min(Math.max(Math.log10(capacitance), 1), 4); // 1 to 4
                const volScale = Math.min(Math.max(Math.log10(voltage), 1), 3); // 1 to 3

                return {
                    width: 40 + (capScale * 15), // Base 40px
                    height: 60 + (volScale * 20) + (capScale * 10) // Base 60px
                };
            }, [capacitance, voltage]);

            return (
                <div className="min-h-screen flex flex-col items-center py-10 px-4 max-w-xl mx-auto font-sans">
                    <header className="text-center mb-8">
                        <h1 className="text-2xl md:text-3xl font-bold text-slate-800 mb-2">
                            <i className="fas fa-battery-full text-blue-600 mr-2"></i>
                            อ่านค่า Capacitor แบบ Electrolytic
                        </h1>
                        <p className="text-slate-500">จำลองและคำนวณพลังงานตัวเก็บประจุ</p>
                    </header>

                    <div className="bg-white rounded-2xl shadow-xl w-full overflow-hidden border border-slate-200">

                        {/* Visual Simulator Section */}
                        <div className="bg-slate-100 p-8 flex justify-center items-end h-72 relative border-b border-slate-200 overflow-hidden">

                            {/* Grid Background */}
                            <div className="absolute inset-0 opacity-10"
                                style={{ backgroundImage: "linear-gradient(#000 1px, transparent 1px), linear-gradient(90deg, #000 1px, transparent 1px)", backgroundSize: "20px 20px" }}>
                            </div>

                            {/* The Capacitor Component */}
                            <div className="relative flex flex-col items-center z-10 transition-all duration-500 ease-out">

                                {/* Capacitor Body */}
                                <div
                                    className="relative rounded-sm shadow-2xl flex items-center justify-center overflow-hidden transition-all duration-500"
                                    style={{
                                        width: `${visualSize.width * 2}px`,
                                        height: `${visualSize.height * 2}px`,
                                        background: "linear-gradient(90deg, #1e293b 0%, #334155 40%, #0f172a 100%)", // Dark Blue/Black body
                                        borderRadius: `${visualSize.width * 0.1}px`
                                    }}
                                >
                                    {/* Top Metal Cap */}
                                    <div className="absolute top-0 w-full h-[10%] bg-[#cbd5e1] border-b border-slate-500/50">
                                        {/* Vent lines */}
                                        <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[60%] h-[60%] opacity-30 border-t border-l border-slate-800 rotate-45"></div>
                                        <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[60%] h-[60%] opacity-30 border-t border-l border-slate-800 rotate-[135deg]"></div>
                                        <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[60%] h-[60%] opacity-30 border-t border-l border-slate-800 rotate-[225deg]"></div>
                                    </div>

                                    {/* Negative Stripe */}
                                    <div className="absolute left-2 top-[10%] bottom-2 w-[15%] bg-gray-300/80 flex flex-col items-center justify-center space-y-2 overflow-hidden">
                                        {[...Array(5)].map((_, i) => (
                                            <div key={i} className="w-[60%] h-1 bg-black rounded-full"></div> // Minus signs
                                        ))}
                                    </div>

                                    {/* Text Label */}
                                    <div className="absolute right-2 top-[30%] text-right text-gray-200 font-mono flex flex-col items-end">
                                        <div className="font-bold tracking-widest drop-shadow-md" style={{ fontSize: `${Math.min(visualSize.width * 0.4, 24)}px` }}>
                                            {capacitance}µF
                                        </div>
                                        <div className="font-medium opacity-80" style={{ fontSize: `${Math.min(visualSize.width * 0.3, 18)}px` }}>
                                            {voltage}V
                                        </div>
                                        <div className="text-[10px] opacity-50 mt-1">
                                            105°C
                                        </div>
                                    </div>

                                    {/* Light Reflection */}
                                    <div className="absolute right-[20%] top-0 bottom-0 w-[10%] bg-white opacity-5 skew-x-6 blur-sm"></div>
                                </div>

                                {/* Legs */}
                                <div className="flex gap-4 mt-[-2px] z-[-1]">
                                    {/* Positive Leg (Longer) */}
                                    <div className="flex flex-col items-center">
                                        <div className="w-1.5 h-12 bg-gray-400 shadow-sm"></div>
                                        <div className="text-xs font-bold text-green-600 mt-1">+ (ยาว)</div>
                                    </div>
                                    {/* Negative Leg (Shorter) */}
                                    <div className="flex flex-col items-center">
                                        <div className="w-1.5 h-8 bg-gray-400 shadow-sm"></div>
                                        <div className="text-xs font-bold text-red-500 mt-5">- (สั้น)</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Controls & Results */}
                        <div className="p-6 bg-white">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">

                                {/* Inputs */}
                                <div className="space-y-6">
                                    <h3 className="font-bold text-slate-700 border-b pb-2 mb-4">ตั้งค่าพารามิเตอร์</h3>

                                    <div>
                                        <label className="block text-sm font-semibold text-slate-500 mb-1">ความจุ (Capacitance)</label>
                                        <div className="flex items-center gap-2">
                                            <input
                                                type="number"
                                                value={capacitance}
                                                onChange={(e) => setCapacitance(Math.max(0, Number(e.target.value)))}
                                                className="w-full p-2 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 font-mono text-lg text-right"
                                            />
                                            <span className="font-bold text-slate-600">µF</span>
                                        </div>
                                        <input
                                            type="range" min="1" max="10000" step="10"
                                            value={capacitance}
                                            onChange={(e) => setCapacitance(Number(e.target.value))}
                                            className="w-full mt-2 accent-blue-600"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-slate-500 mb-1">แรงดัน (Voltage)</label>
                                        <div className="flex items-center gap-2">
                                            <input
                                                type="number"
                                                value={voltage}
                                                onChange={(e) => setVoltage(Math.max(0, Number(e.target.value)))}
                                                className="w-full p-2 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 font-mono text-lg text-right"
                                            />
                                            <span className="font-bold text-slate-600">V</span>
                                        </div>
                                        <input
                                            type="range" min="1" max="450"
                                            value={voltage}
                                            onChange={(e) => setVoltage(Number(e.target.value))}
                                            className="w-full mt-2 accent-red-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-slate-500 mb-1">ความถี่ (Frequency for Xc)</label>
                                        <div className="flex items-center gap-2">
                                            <input
                                                type="number"
                                                value={frequency}
                                                onChange={(e) => setFrequency(Math.max(0, Number(e.target.value)))}
                                                className="w-full p-2 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 font-mono text-lg text-right"
                                            />
                                            <span className="font-bold text-slate-600">Hz</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Results */}
                                <div className="space-y-4">
                                    <h3 className="font-bold text-slate-700 border-b pb-2 mb-4">ผลลัพธ์ทางไฟฟ้า</h3>

                                    <div className="bg-blue-50 p-4 rounded-xl border border-blue-100">
                                        <div className="text-xs text-blue-600 uppercase font-bold tracking-wider mb-1">พลังงานสะสม (Energy)</div>
                                        <div className="text-3xl font-bold text-blue-800">{stats.energy}</div>
                                        <div className="text-xs text-blue-400 mt-1 italic">E = ½CV²</div>
                                    </div>

                                    <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-100">
                                        <div className="text-xs text-emerald-600 uppercase font-bold tracking-wider mb-1">ประจุไฟฟ้า (Charge)</div>
                                        <div className="text-3xl font-bold text-emerald-800">{stats.charge}</div>
                                        <div className="text-xs text-emerald-400 mt-1 italic">Q = CV</div>
                                    </div>

                                    <div className="bg-orange-50 p-4 rounded-xl border border-orange-100">
                                        <div className="text-xs text-orange-600 uppercase font-bold tracking-wider mb-1">ค่ารีแอกแตนซ์ (Xc)</div>
                                        <div className="text-3xl font-bold text-orange-800">{stats.xc}</div>
                                        <div className="text-xs text-orange-400 mt-1 italic">@ {frequency} Hz</div>
                                    </div>
                                </div>

                            </div>
                        </div>

                        {/* Footer Warning */}
                        <div className="bg-yellow-50 p-4 text-xs text-yellow-800 border-t border-yellow-200 flex items-start gap-2">
                            <i className="fas fa-exclamation-triangle mt-0.5"></i>
                            <span>
                                <strong>คำเตือน:</strong> อิเล็กโทรไลต์มีขั้ว ห้ามต่อกลับขั้วเด็ดขาด (ระเบิดได้) <br />
                                - <strong>แถบสีบนตัวถัง</strong> จะชี้ไปที่ขา <strong>ลบ (-)</strong> เสมอ <br />
                                - สำหรับของใหม่ ขาที่ยาวกว่าคือ <strong>บวก (+)</strong>
                            </span>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>

</html>
