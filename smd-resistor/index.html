<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องคำนวณรหัส SMD (SMD Resistor Calculator)</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Sarabun', sans-serif;
        }
    </style>
</head>

<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // --- ข้อมูลสำหรับ SMD EIA-96 ---
        const EIA96_CODES = {
            "01": 100, "02": 102, "03": 105, "04": 107, "05": 110, "06": 113, "07": 115, "08": 118, "09": 121, "10": 124,
            "11": 127, "12": 130, "13": 133, "14": 137, "15": 140, "16": 143, "17": 147, "18": 150, "19": 154, "20": 158,
            "21": 162, "22": 165, "23": 169, "24": 174, "25": 178, "26": 182, "27": 187, "28": 191, "29": 196, "30": 200,
            "31": 205, "32": 210, "33": 215, "34": 221, "35": 226, "36": 232, "37": 237, "38": 243, "39": 249, "40": 255,
            "41": 261, "42": 267, "43": 274, "44": 280, "45": 287, "46": 294, "47": 301, "48": 309, "49": 316, "50": 324,
            "51": 332, "52": 340, "53": 348, "54": 357, "55": 365, "56": 374, "57": 383, "58": 392, "59": 402, "60": 412,
            "61": 422, "62": 432, "63": 442, "64": 453, "65": 464, "66": 475, "67": 487, "68": 499, "69": 511, "70": 523,
            "71": 536, "72": 549, "73": 562, "74": 576, "75": 590, "76": 604, "77": 619, "78": 634, "79": 649, "80": 665,
            "81": 681, "82": 698, "83": 715, "84": 732, "85": 750, "86": 768, "87": 787, "88": 806, "89": 825, "90": 845,
            "91": 866, "92": 887, "93": 909, "94": 931, "95": 953, "96": 976
        };
        const EIA96_MULTIPLIERS = {
            "Y": 0.01, "R": 0.01, "X": 0.1, "S": 0.1, "A": 1, "B": 10, "C": 100, "D": 1000, "E": 10000, "F": 100000
        };

        const App = () => {
            const [smdCode, setSmdCode] = useState('102');

            const smdResult = useMemo(() => {
                const code = smdCode.trim().toUpperCase();
                if (!code) return 0;

                // 1. จุดทศนิยม (R) เช่น 4R7
                if (code.includes('R')) {
                    return parseFloat(code.replace('R', '.'));
                }

                // 2. EIA-96 (2 ตัวเลข + 1 ตัวอักษร)
                if (code.length === 3) {
                    const valCode = code.substring(0, 2);
                    const multCode = code.substring(2, 3);
                    // ต้องแน่ใจว่า 2 ตัวแรกเป็นตัวเลขจริงๆ (เพื่อแยกจากกรณี 3-digit ปกติที่มีตัวอักษรปนมาแบบผิดๆ)
                    if (!isNaN(valCode) && EIA96_CODES[valCode] && EIA96_MULTIPLIERS[multCode]) {
                        return EIA96_CODES[valCode] * EIA96_MULTIPLIERS[multCode];
                    }
                }

                // 3. Standard 3 or 4 Digit
                // กรองเฉพาะตัวเลข
                if (/^\d+$/.test(code)) {
                    const lastDigit = parseInt(code.slice(-1));
                    const valueDigits = parseInt(code.slice(0, -1));
                    return valueDigits * Math.pow(10, lastDigit);
                }

                return 0;
            }, [smdCode]);

            const formatResistance = (val) => {
                if (!val && val !== 0) return '-'; // กรณีอ่านค่าไม่ออก
                if (val === 0) return '0 Ω';
                if (val >= 1000000) return (val / 1000000).toFixed(val % 1000000 === 0 ? 0 : 2) + ' MΩ';
                if (val >= 1000) return (val / 1000).toFixed(val % 1000 === 0 ? 0 : 2) + ' kΩ';
                return val.toFixed(val % 1 === 0 ? 0 : 2) + ' Ω';
            };

            return (
                <div className="min-h-screen flex flex-col items-center py-10 px-4 max-w-lg mx-auto">
                    <header className="text-center mb-8">
                        <h1 className="text-3xl font-bold text-gray-800 mb-2">
                            <i className="fas fa-microchip text-blue-500 mr-2"></i>
                            SMD Code Calculator
                        </h1>
                        <p className="text-gray-500">แปลงรหัสบนตัวต้านทาน SMD เป็นค่าโอห์ม</p>
                    </header>

                    <div className="bg-white rounded-2xl shadow-xl w-full overflow-hidden border border-gray-100">

                        {/* ส่วนแสดงภาพ (Visual) */}
                        <div className="bg-slate-100 p-8 flex justify-center items-center h-48 relative">
                            <div className="relative w-48 h-24 bg-neutral-900 rounded shadow-2xl flex items-center justify-center border border-neutral-700 transform transition-transform hover:scale-105 duration-300">
                                {/* ขั้วโลหะซ้ายขวา */}
                                <div className="absolute left-0 h-full w-6 bg-gradient-to-r from-gray-300 via-gray-400 to-gray-500 border-r border-gray-600 rounded-l-sm"></div>
                                <div className="absolute right-0 h-full w-6 bg-gradient-to-l from-gray-300 via-gray-400 to-gray-500 border-l border-gray-600 rounded-r-sm"></div>

                                {/* ตัวหนังสือรหัส */}
                                <span className="text-gray-200 font-mono text-4xl font-bold tracking-widest opacity-90 drop-shadow-md">
                                    {smdCode || "?"}
                                </span>

                                {/* แสงสะท้อน */}
                                <div className="absolute top-0 right-0 w-full h-full bg-gradient-to-tr from-transparent via-white/5 to-transparent pointer-events-none"></div>
                            </div>
                        </div>

                        {/* ส่วนแสดงผลลัพธ์ */}
                        <div className="bg-blue-600 text-white p-6 text-center relative overflow-hidden">
                            <div className="absolute -right-4 -top-4 text-blue-500 opacity-20 transform rotate-12">
                                <i className="fas fa-bolt text-8xl"></i>
                            </div>
                            <div className="relative z-10">
                                <div className="text-xs uppercase opacity-80 mb-1 tracking-widest">ค่าความต้านทาน</div>
                                <div className="text-5xl font-bold tracking-tight">
                                    {formatResistance(smdResult)}
                                </div>
                            </div>
                        </div>

                        {/* ส่วนกรอกข้อมูล */}
                        <div className="p-8">
                            <div className="flex flex-col items-center">
                                <label className="text-sm font-bold text-gray-500 mb-3 uppercase tracking-wide">
                                    กรอกรหัส 3-4 หลัก
                                </label>
                                <div className="relative w-full max-w-xs">
                                    <input
                                        type="text"
                                        value={smdCode}
                                        onChange={(e) => setSmdCode(e.target.value.toUpperCase())}
                                        maxLength={4}
                                        className="w-full text-center text-3xl font-mono p-3 border-2 border-gray-300 rounded-xl focus:border-blue-500 focus:ring-4 focus:ring-blue-100 outline-none transition-all uppercase text-slate-700 placeholder-slate-300"
                                        placeholder="102"
                                    />
                                    <div className="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none">
                                        <i className="fas fa-keyboard"></i>
                                    </div>
                                </div>

                                {/* คำอธิบายรูปแบบ */}
                                <div className="mt-8 grid grid-cols-1 gap-3 w-full text-sm text-gray-600">
                                    <div className="flex items-start p-3 bg-gray-50 rounded-lg border border-gray-100 hover:bg-blue-50 transition-colors">
                                        <span className="bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded text-xs mr-3 mt-0.5">3-Digit</span>
                                        <div>
                                            <span className="font-mono font-bold text-gray-800">102</span> = 10 x 10² = 1 kΩ
                                        </div>
                                    </div>
                                    <div className="flex items-start p-3 bg-gray-50 rounded-lg border border-gray-100 hover:bg-blue-50 transition-colors">
                                        <span className="bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded text-xs mr-3 mt-0.5">4-Digit</span>
                                        <div>
                                            <span className="font-mono font-bold text-gray-800">1001</span> = 100 x 10¹ = 1 kΩ
                                        </div>
                                    </div>
                                    <div className="flex items-start p-3 bg-gray-50 rounded-lg border border-gray-100 hover:bg-blue-50 transition-colors">
                                        <span className="bg-purple-100 text-purple-700 font-bold px-2 py-0.5 rounded text-xs mr-3 mt-0.5">EIA-96</span>
                                        <div>
                                            <span className="font-mono font-bold text-gray-800">01C</span> = Code 01 (100) x C (100) = 10 kΩ
                                        </div>
                                    </div>
                                    <div className="flex items-start p-3 bg-gray-50 rounded-lg border border-gray-100 hover:bg-blue-50 transition-colors">
                                        <span className="bg-orange-100 text-orange-700 font-bold px-2 py-0.5 rounded text-xs mr-3 mt-0.5">Decimal</span>
                                        <div>
                                            <span className="font-mono font-bold text-gray-800">4R7</span> = 4.7 Ω
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <footer className="mt-8 text-xs text-gray-400 text-center">
                        &copy; SMD Calculator Tool
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
